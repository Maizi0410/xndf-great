name: Deploy web game to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/prepare-assets.mjs"
      - "scripts/record-web-run.mjs"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - "playwright.config.ts"
      - "tests/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/record-web-run.mjs running

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check types and game rules
        run: |
          npm run typecheck
          npm test
      - name: Build web game with repository subpath and all local assets
        run: |
          npm run build:web
          touch dist-web/.nojekyll
      - name: Validate subpath, full mouse journey and local hand inference
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4175/xndf-great/
          PLAYWRIGHT_SERVER_COMMAND: npm run preview:web -- --port 4175 --strictPort
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-validation-diagnostics
          path: test-results/

  deploy:
    needs: [build, announce]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
      live_result: ${{ steps.live.outcome }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # GitHub requires the repository owner to select Pages → GitHub Actions
      # once. GITHUB_TOKEN can deploy, but cannot enable a new Pages site.
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check live HTTPS entry, revision, subpath and offline model
        id: live
        env:
          GAME_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          const base = process.env.GAME_URL;
          if (!base?.startsWith('https://')) throw new Error('Missing HTTPS deployment URL');
          for (let attempt = 0; attempt < 8; attempt++) {
            try {
              const page = await fetch(base, { signal: AbortSignal.timeout(20000) });
              if (!page.ok) throw new Error(`Page HTTP ${page.status}`);
              const html = await page.text();
              const info = await fetch(new URL(`build-info.json?rev=${process.env.GITHUB_SHA}`, base));
              if (!info.ok || (await info.json()).source_commit !== process.env.GITHUB_SHA) throw new Error('Live site has not updated to this commit');
              if (!html.includes('THE PERMITTED WORLD')) throw new Error('Wrong page');
              const assets = [...html.matchAll(new RegExp('(?:src|href)="([^"]+/assets/[^"]+)"', 'g'))];
              if (assets.length < 2) throw new Error('Missing script/style references');
              for (const [, asset] of assets) {
                const r = await fetch(new URL(asset, base));
                if (!r.ok) throw new Error(`Missing deployed asset: ${asset}`);
              }
              const model = await fetch(new URL('vision/hand_landmarker.task', base));
              if (!model.ok) throw new Error(`Model HTTP ${model.status}`);
              const hash = createHash('sha256').update(Buffer.from(await model.arrayBuffer())).digest('hex');
              if (hash !== '94cae88157602cec45e48fe0c572b418a9641a9aae977ffd71dddbce167201a1') throw new Error('Deployed model checksum mismatch');
              const wasm = await fetch(new URL('vision/wasm/vision_wasm_internal.wasm', base));
              if (!wasm.ok || !wasm.headers.get('content-type')?.includes('application/wasm')) throw new Error('Missing WASM or wrong MIME type');
              const musicInfo = await fetch(new URL('audio/bgm_exploration.json', base));
              if (!musicInfo.ok) throw new Error('Missing music manifest');
              const music = await musicInfo.json();
              const mp3 = await fetch(new URL('audio/bgm_exploration.mp3', base));
              if (!mp3.ok || !/^audio\/(?:mpeg|mp3)(?:;|$)/i.test(mp3.headers.get('content-type') || '')) throw new Error('Missing music or wrong MIME');
              const musicHash = createHash('sha256').update(Buffer.from(await mp3.arrayBuffer())).digest('hex');
              if (musicHash !== music.playback_sha256) throw new Error('Live music checksum mismatch');
              console.log(`Verified live web entry: ${base}`);
              process.exit(0);
            } catch (error) {
              console.warn(error.message);
              if (attempt === 7) throw error;
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
          }
          JS

  record-result:
    if: always()
    needs: [announce, build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Record actual deployment and live verification results
        env:
          WEB_BUILD_RESULT: ${{ needs.build.result }}
          WEB_DEPLOY_RESULT: ${{ needs.deploy.result }}
          WEB_LIVE_RESULT: ${{ needs.deploy.outputs.live_result }}
          WEB_PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/record-web-run.mjs completed

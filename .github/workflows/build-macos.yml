name: Build Apple Silicon Mac
on:
  workflow_dispatch:
    inputs:
      signed:
        description: "Developer ID 签名并公证（必须预先配置全部 Secrets）"
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-arm64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install frozen dependencies and Electron
        run: |
          npm ci
          npx --no-install install-electron
      - name: Validate rules and types
        run: |
          npm run typecheck
          npm test
      - name: Build all offline assets
        run: npm run build
      - name: Browser acceptance
        run: |
          npx playwright install chromium
          npm run test:e2e
      - name: Build ad-hoc internal DMG
        if: ${{ !inputs.signed }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac --arm64 --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false
      - name: Build signed and notarized DMG
        if: ${{ inputs.signed }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            test -n "${!name}" || { echo "Missing required signing secret: $name"; exit 1; }
          done
          npx electron-builder --mac --arm64 --publish never -c.mac.notarize=true
          codesign --verify --deep --strict "release/mac-arm64/The Permitted World.app"
          xcrun stapler validate "release/mac-arm64/The Permitted World.app"
          spctl --assess --type execute --verbose "release/mac-arm64/The Permitted World.app"
      - name: Check ARM64 architecture, bundle resources and DMG integrity
        run: npm run verify:mac | tee release/verification.txt
      - name: Electron packaged application smoke test
        env:
          PERMITTED_PACKAGED: "1"
        run: node scripts/smoke-electron.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: The-Permitted-World-Apple-Silicon-arm64-${{ inputs.signed && 'signed-notarized' || 'adhoc-internal' }}
          path: |
            release/*arm64.dmg
            release/verification.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: validation-diagnostics
          path: |
            test-results/
            playwright-report/
